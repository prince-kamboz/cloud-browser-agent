map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;

  # Chat UI (static files only, mounted from ./web)
  root /srv/web;
  index index.html;
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store";
  }

  # Deep Agents service (POC). SSE, so no buffering.
  location /agent/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Chrome DevTools Protocol (how the agent clicks, types and takes screenshots).
  # Chrome only accepts Host: localhost, so it is rewritten here.
  location /cdp/ {
    proxy_pass http://127.0.0.1:9222/;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1d;
    client_max_body_size 20m;
  }
}
